<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>AIGC 入门思维导图</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      :root {
        --bg: #eef0f3;
        --dot: #d3d8e0;
        --surface: #ffffff;
        --ink: #1c2330;
        --ink-soft: #4a5468;
        --bar-bg: rgba(255,255,255,.88);
        --bar-border: #dde1e8;
        --btn-bg: #ffffff;
        --btn-border: #ccd2dd;
        --btn-hover: #eef2f8;
        --root-bg: #1d2534;
        --root-ink: #f5f7fa;
        --shadow: 0 2px 10px rgba(23,32,54,.10), 0 1px 3px rgba(23,32,54,.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151b;
          --dot: #232936;
          --surface: #1e242f;
          --ink: #e8ecf3;
          --ink-soft: #a5aec0;
          --bar-bg: rgba(22,26,34,.9);
          --bar-border: #2c3342;
          --btn-bg: #232a37;
          --btn-border: #39415455;
          --btn-hover: #2b3345;
          --root-bg: #e8ecf3;
          --root-ink: #171c26;
          --shadow: 0 2px 10px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- toolbar ---------- */
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px 12px;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--bar-border);
        backdrop-filter: blur(8px);
        z-index: 20;
      }
      .tb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .tb-group + .tb-group { margin-left: auto; }
      .tb-label { font-size: 12px; color: var(--ink-soft); margin-right: 2px; white-space: nowrap; }
      .toolbar button {
        font: inherit;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink);
        background: var(--btn-bg);
        border: 1px solid var(--btn-border);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .toolbar button:hover { background: var(--btn-hover); }
      .toolbar button:active { transform: translateY(1px); }
      .toolbar button:focus-visible { outline: 2px solid #4c8dff; outline-offset: 1px; }
      .zoom-label { font-size: 13px; color: var(--ink-soft); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
      .zoom-btn { width: 38px; padding: 6px 0 !important; font-size: 16px !important; }

      /* ---------- viewport / world ---------- */
      #viewport {
        flex: 1 1 auto;
        position: relative;
        overflow: hidden;
        background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.2px);
        background-size: 26px 26px;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #viewport.dragging { cursor: grabbing; }
      #world {
        position: absolute;
        left: 0; top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
      #edges path { fill: none; stroke-linecap: round; }

      /* ---------- nodes ---------- */
      .node {
        position: absolute;
        display: flex;
        align-items: flex-start;
        gap: 7px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        line-height: 1.45;
        word-break: break-word;
      }
      .node .txt { flex: 1 1 auto; }
      .node.has-kids { cursor: pointer; }
      .node.has-kids:focus-visible { outline: 2px solid #4c8dff; outline-offset: 2px; }
      .node .toggle {
        flex: 0 0 auto;
        width: 22px; height: 22px;
        margin-top: 1px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; line-height: 1;
        pointer-events: none;
      }
      .node.root {
        background: var(--root-bg);
        color: var(--root-ink);
        font-size: 25px;
        font-weight: 900;
        letter-spacing: .06em;
        padding: 18px 26px;
        border-radius: 16px;
        max-width: 300px;
        text-align: center;
        justify-content: center;
      }
      .node.root .sub {
        display: block;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: .14em;
        opacity: .62;
        margin-top: 5px;
      }
      .node.d1 {
        background: var(--c);
        color: #fff;
        font-size: 17.5px;
        font-weight: 700;
        padding: 11px 14px;
        border-radius: 12px;
        max-width: 250px;
      }
      .node.d1 .num {
        flex: 0 0 auto;
        width: 24px; height: 24px;
        border-radius: 50%;
        background: rgba(255,255,255,.24);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 900;
        margin-top: 1px;
      }
      .node.d1 .toggle { background: rgba(255,255,255,.26); color: #fff; }
      .node.d2 {
        background: color-mix(in srgb, var(--c) 13%, var(--surface));
        border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
        color: var(--ink);
        font-size: 14.5px;
        font-weight: 500;
        padding: 8px 11px;
        max-width: 248px;
      }
      .node.d2 .toggle { background: color-mix(in srgb, var(--c) 20%, var(--surface)); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
      .node.d3 {
        background: var(--surface);
        border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
        color: var(--ink-soft);
        font-size: 13.5px;
        font-weight: 400;
        padding: 6px 10px;
        max-width: 224px;
        box-shadow: 0 1px 4px rgba(23,32,54,.07);
      }
      .node.d3 .toggle { background: var(--btn-hover); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
      .node b, .node strong { font-weight: 700; color: inherit; }
      .node .tag {
        display: inline-block;
        font-size: 11px; font-weight: 700;
        padding: 0 6px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--c) 18%, transparent);
        color: var(--c);
        margin-left: 5px;
        vertical-align: 1px;
        white-space: nowrap;
      }

      /* ---------- hint bar ---------- */
      .hint {
        flex: 0 0 auto;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        background: var(--bar-bg);
        border-top: 1px solid var(--bar-border);
        text-align: center;
      }
      .hint b { color: var(--ink); font-weight: 600; }
      @media (max-width: 640px) {
        .node.root { font-size: 21px; padding: 14px 20px; }
        .node.d1 { font-size: 16px; }
        .tb-label { display: none; }
      }
    </style>
  </head>
  <body>

    <div class="toolbar" role="toolbar" aria-label="思维导图控制">
      <div class="tb-group">
        <span class="tb-label">展开</span>
        <button type="button" id="btnAll">全部展开</button>
        <button type="button" id="btnL2">展开到二级</button>
        <button type="button" id="btnL1">只看分支</button>
      </div>
      <div class="tb-group">
        <button type="button" class="zoom-btn" id="btnOut" aria-label="缩小">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button type="button" class="zoom-btn" id="btnIn" aria-label="放大">＋</button>
        <button type="button" id="btnFit">适应屏幕</button>
        <button type="button" id="btnFull">全屏讲课</button>
      </div>
    </div>

    <div id="viewport">
      <div id="world">
        <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes"></div>
      </div>
    </div>

    <div class="hint">学习顺序：从 <b>第 1 支</b> 学到 <b>第 10 支</b>，每支末尾都有 <b>动手任务</b> 和 <b>过关标准</b>，过关再往下走 · 操作：<b>拖动</b>平移 · <b>滚轮 / 双指</b>缩放 · 点击带 <b>＋ / −</b> 的节点展开、折叠</div>

    <script>

                { text: "产出：3 条不同生成方式的小视频（T2V、I+T2V、首尾帧各一条）" }
              ]},
              { text: "第 2 周（第 4–6 支）", children: [
                { text: "产出：一个角色的定妆图 + 同角色 3 镜头小片段，一致性过关" }
              ]},
              { text: "第 3 周（第 7 支）", children: [
                { text: "产出：一条完整的 30 秒短片（有声音、有字幕、走了九步流程）" }
              ]},
              { text: "第 4 周（第 8–9 支 + 复盘）", children: [
                { text: "产出：把第 3 周的片子按翻车表逐条挑毛病、重做一版 v2" },
                { text: "并写一页复盘：哪镜抽了多少次、钱花在哪" }
              ]}
            ]},
            { text: "拆解练习（贯穿全程）", children: [
              { text: "每周挑一条喜欢的 AI 短片，按四层逆向拆解：分镜、提示词、一致性、后期" },
              { text: "拆 5 条，胜过自己闷头抽 50 条" }
            ]},
            { text: "进阶方向", children: [
              { text: "工作流：ComfyUI 深入（ControlNet 全家桶、批量自动化）/ RunningHub 高阶工作流" },
              { text: "短剧方向：小云雀短剧 Agent、LibTV 全流程量产" },
              { text: "电商方向：Lovart 整套物料、TapNow 产品视频流水线" },
              { text: "账号方向：选一个赛道，用第 7 支流程周更，靠产量和复盘涨手感" }
            ]},
            { text: "动手任务", children: [
              { text: "按四周计划排好日程，先完成第 1 周的 3 条视频" }
            ]},
            { text: "过关标准（结业）", children: [
              { text: "独立完成一条 1 分钟短片，并能完整讲清自己的制作流程——讲得清，才算真的学会" }
            ]}
          ]}
        ]
      };
      /* ================= 建树 ================= */
      var nodesBox = document.getElementById("nodes");
      var svg = document.getElementById("edges");
      /* 测量容器：挂在 body 下、宽度已知，避免被 #world 的收缩宽度影响测量 */
      var measurer = document.createElement("div");
      measurer.style.cssText = "position:absolute;left:-10000px;top:0;width:2400px;visibility:hidden;pointer-events:none;";
      document.body.appendChild(measurer);
      var all = [];
      var uid = 0;

      function build(data, parent, depth) {
        var n = {
          id: uid++, data: data, parent: parent, depth: depth,
          children: [], collapsed: false,
          color: depth === 1 ? data.color : (parent ? parent.color : "#333"),
          side: 0, w: 0, h: 0,
          x: 0, y: 0, cx: 0, cy: 0, opacity: 0, shown: false,
          tx: 0, ty: 0, fromX: 0, fromY: 0, fromO: 0
        };
        var el = document.createElement("div");
        el.className = "node " + (depth === 0 ? "root" : "d" + Math.min(depth, 3)) + (depth > 0 && data.children && data.children.length ? " has-kids" : "");
        el.style.setProperty("--c", n.color);
        el.style.position = "absolute";
        el.style.left = "0px"; el.style.top = "0px";
        el.style.visibility = "hidden";

        var txt = document.createElement("span");
        txt.className = "txt";
        if (depth === 0) {
          txt.innerHTML = "";
          txt.appendChild(document.createTextNode(data.text));
          var sub = document.createElement("span");
          sub.className = "sub";
          sub.textContent = data.sub || "";
          txt.appendChild(sub);
        } else {
          txt.textContent = data.text;
          if (data.tag) {
            var tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = data.tag;
            txt.appendChild(tag);
          }
        }
        if (depth === 1) {
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = String(parent.children.length + 1);
          el.appendChild(num);
        }
        el.appendChild(txt);
        if (depth > 0 && data.children && data.children.length) {
          var tg = document.createElement("span");
          tg.className = "toggle";
          tg.textContent = "＋";
          el.appendChild(tg);
          n.toggleEl = tg;
        }
        el.addEventListener("click", function (ev) {
          if (suppressClick) return;
          if (n.depth > 0 && n.children.length) {
            n.collapsed = !n.collapsed;
            layout(true);
          }
          ev.stopPropagation();
        });
        if (depth > 0 && data.children && data.children.length) {
          el.tabIndex = 0;
          el.setAttribute("role", "button");
          el.setAttribute("aria-expanded", "true");
          el.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              n.collapsed = !n.collapsed;
              layout(true);
            }
          });
        }
        n.el = el;
        el.__node = n;
        measurer.appendChild(el);
        all.push(n);
        if (parent) parent.children.push(n);
        (data.children || []).forEach(function (c) { build(c, n, depth + 1); });
        return n;
      }

      var root = build(DATA, null, 0);
      root.children.forEach(function (b, i) { b.side = (i % 2 === 0) ? 1 : -1; });
      /* 从每个分支往下传播 side（不能从 root 传播，root.side=0 会覆盖分支的 ±1） */
      root.children.forEach(function (b) {
        (function setSide(n) {
          n.children.forEach(function (c) { c.side = n.side; setSide(c); });
        })(b);
      });

      /* 初始状态：只展开到二级——一级分支（depth 1）展开、其二级主题组可见，
         深度 ≥2 的节点初始折叠，讲课时逐层点开；与工具栏「展开到二级」一致 */
      all.forEach(function (n) { n.collapsed = n.depth >= 2; });

      /* 在已知宽度的测量容器里量准尺寸，再把节点移进画布 */
      function measureAll() {
        all.forEach(function (n) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; });
      }
      measureAll();
      all.forEach(function (n) { nodesBox.appendChild(n.el); });
      measurer.remove();

      /* ================= 布局 ================= */
      var HGAP = 46, VGAP = 13, PAD = 60;
      var bbox = { x: 0, y: 0, w: 0, h: 0 };

      function visible(n) {
        var p = n.parent;
        while (p) { if (p.collapsed) return false; p = p.parent; }
        return true;
      }
      function subH(n) {
        if (!n.children.length || n.collapsed) return n.h;
        var s = 0;
        n.children.forEach(function (c, i) { s += subH(c) + (i ? VGAP : 0); });
        return Math.max(n.h, s);
      }
      function place(n, edgeX, cy) {
        n.x = n.side >= 0 ? edgeX : edgeX - n.w;
        n.y = cy - n.h / 2;
        if (n.children.length && !n.collapsed) {
          var total = 0;
          n.children.forEach(function (c, i) { total += subH(c) + (i ? VGAP : 0); });
          var y = cy - total / 2;
          n.children.forEach(function (c) {
            var h = subH(c);
            var childEdge = n.side >= 0 ? n.x + n.w + HGAP : n.x - HGAP;
            place(c, childEdge, y + h / 2);
            y += h + VGAP;
          });
        }
      }
      function layout(animate) {
        /* 每次布局前在画布内重测一遍节点尺寸：字体后加载、内嵌浏览器
           字体度量不同都会让先前量到的宽高过期，间距随之算错、节点压叠 */
        measureAll();
        var fitNow = false;
        if (!animate) {
          if (animId) { cancelAnimationFrame(animId); animId = null; }
          if (animTimer) { clearTimeout(animTimer); animTimer = null; }
          if (fitPending) { fitPending = false; fitNow = true; }
        }
        /* 根节点居中，两侧分支各自堆叠 */
        [1, -1].forEach(function (side) {
          var bs = root.children.filter(function (b) { return b.side === side; });
          var total = 0;
          bs.forEach(function (b, i) { total += subH(b) + (i ? VGAP + 8 : 0); });
          var y = -total / 2;
          bs.forEach(function (b) {
            var h = subH(b);
            var edge = side > 0 ? root.w / 2 + HGAP : -root.w / 2 - HGAP;
            place(b, edge, y + h / 2);
            y += h + VGAP + 8;
          });
        });
        root.x = -root.w / 2; root.y = -root.h / 2;

        /* 计算包围盒并平移到正坐标 */
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        all.forEach(function (n) {
          if (!visible(n)) return;
          minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
        });
        var dx = PAD - minX, dy = PAD - minY;
        all.forEach(function (n) { n.tx = n.x + dx; n.ty = n.y + dy; });
        bbox = { x: 0, y: 0, w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2 };
        /* 给世界一个明确尺寸（含余量），保证节点在其中按内容自然宽度收缩适配，
           否则 #world 宽度塌缩会把节点重新挤窄 */
        world.style.width = (bbox.w + 600) + "px";
        world.style.height = (bbox.h + 200) + "px";
        svg.setAttribute("width", bbox.w);
        svg.setAttribute("height", bbox.h);
        svg.setAttribute("viewBox", "0 0 " + bbox.w + " " + bbox.h);

        all.forEach(function (n) {
          n.fromX = n.cx; n.fromY = n.cy; n.fromO = n.opacity;
          if (visible(n)) {
            if (!n.shown) {
              var a = nearestShownAncestor(n);
              n.fromX = a ? a.cx + a.w / 2 - n.w / 2 : n.tx;
              n.fromY = a ? a.cy + a.h / 2 - n.h / 2 : n.ty;
              n.fromO = 0;
            }
          } else if (n.shown) {
            var anc = nearestShownAncestor(n);
            if (anc) { n.tx = anc.tx + anc.w / 2 - n.w / 2; n.ty = anc.ty + anc.h / 2 - n.h / 2; }
          }
          if (n.toggleEl) n.toggleEl.textContent = n.collapsed ? "＋" : "−";
          if (n.depth > 0 && n.children.length) n.el.setAttribute("aria-expanded", String(!n.collapsed));
        });

        if (!animate) { finishLayout(1); if (fitNow) fitView(); return; }
        startAnim();
      }
      function nearestShownAncestor(n) {
        var p = n.parent;
        while (p && !visible(p)) p = p.parent;
        return p;
      }

      /* ---------- 动画 ---------- */
      var animId = null, animStart = 0, animTimer = null, fitPending = false;
      var ANIM_MS = 430;
      function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function animDone() {
        if (animTimer) { clearTimeout(animTimer); animTimer = null; }
        if (fitPending) { fitPending = false; fitView(); }
      }
      /* 强制把进行中的动画落到最终位置 */
      function completeAnim() {
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        if (animTimer) { clearTimeout(animTimer); animTimer = null; }
        finishLayout(1);
        if (fitPending) { fitPending = false; fitView(); }
      }
      function startAnim() {
        if (animId) cancelAnimationFrame(animId);
        if (animTimer) clearTimeout(animTimer);
        animStart = performance.now();
        var step = function (now) {
          var t = Math.min(1, (now - animStart) / ANIM_MS);
          finishLayout(ease(t));
          if (t < 1) animId = requestAnimationFrame(step);
          else { animId = null; animDone(); }
        };
        animId = requestAnimationFrame(step);
        /* 兜底：部分内嵌 WebView 会节流甚至暂停 requestAnimationFrame，
           帧回调迟迟不来时节点会停在父节点中心挤成一摞；用定时器强制落位 */
        animTimer = setTimeout(completeAnim, ANIM_MS + 160);
      }
      function finishLayout(t) {
        all.forEach(function (n) {
          var vis = visible(n);
          var targetO = vis ? 1 : 0;
          n.cx = n.fromX + (n.tx - n.fromX) * t;
          n.cy = n.fromY + (n.ty - n.fromY) * t;
          n.opacity = n.fromO + (targetO - n.fromO) * t;
          n.shown = n.opacity > 0.01;
          n.el.style.visibility = n.shown ? "visible" : "hidden";
          n.el.style.left = n.cx + "px";
          n.el.style.top = n.cy + "px";
          n.el.style.opacity = n.opacity.toFixed(3);
        });
        drawEdges();
      }
      function drawEdges() {
        var s = "";
        all.forEach(function (n) {
          if (!n.parent || !n.shown || !n.parent.shown) return;
          var p = n.parent;
          var x1 = n.side >= 0 ? p.cx + p.w : p.cx;
          var y1 = p.cy + p.h / 2;
          var x2 = n.side >= 0 ? n.cx : n.cx + n.w;
          var y2 = n.cy + n.h / 2;
          var bend = Math.max(26, Math.abs(x2 - x1) * 0.45);
          var c1 = n.side >= 0 ? x1 + bend : x1 - bend;
          var c2 = n.side >= 0 ? x2 - bend : x2 + bend;
          var wdt = n.depth === 1 ? 5 : (n.depth === 2 ? 3.4 : 2.4);
          var op = Math.min(n.opacity, p.opacity);
          s += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
               ' C' + c1.toFixed(1) + ' ' + y1.toFixed(1) + ', ' + c2.toFixed(1) + ' ' + y2.toFixed(1) + ', ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
               '" stroke="' + n.color + '" stroke-width="' + wdt + '" opacity="' + (op * 0.96).toFixed(2) + '"/>';
        });
        svg.innerHTML = s;
      }

      /* ================= 平移 / 缩放 ================= */
      var viewport = document.getElementById("viewport");
      var world = document.getElementById("world");
      var view = { tx: 0, ty: 0, k: 1 };
      var zoomLabel = document.getElementById("zoomLabel");

      function applyView() {
        world.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.k + ")";
        zoomLabel.textContent = Math.round(view.k * 100) + "%";
      }
      function fitView() {
        var vw = viewport.clientWidth, vh = viewport.clientHeight;
        var k = Math.min(vw / bbox.w, vh / bbox.h, 1.15);
        view.k = Math.max(k, 0.05);
        view.tx = (vw - bbox.w * view.k) / 2;
        view.ty = (vh - bbox.h * view.k) / 2;
        applyView();
      }
      function zoomAt(mx, my, factor) {
        var k2 = Math.min(2.6, Math.max(0.12, view.k * factor));
        var r = k2 / view.k;
        view.tx = mx - (mx - view.tx) * r;
        view.ty = my - (my - view.ty) * r;
        view.k = k2;
        applyView();
      }

      var pointers = new Map();
      var dragMoved = 0, suppressClick = false;
      var pinchD0 = 0, pinchK0 = 1;
      var tapNode = null, captured = false, userTouched = false;

      function nodeFromEvent(e) {
        var t = e.target;
        if (!t || !t.closest) return null;
        var el = t.closest(".node");
        return el && el.__node ? el.__node : null;
      }

      viewport.addEventListener("pointerdown", function (e) {
        /* 不要一按下就 setPointerCapture：它会把随后的 click 改投给画布，
           节点自己的点击监听永远收不到，点 ＋/− 毫无反应。
           改为拖动超过阈值后才捕获，点按在 pointerup 里直接处理。 */
        if (animId || animTimer) completeAnim();
        userTouched = true;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        dragMoved = 0;
        tapNode = pointers.size === 1 ? nodeFromEvent(e) : null;
        if (pointers.size === 2) {
          tapNode = null;
          var pts = Array.from(pointers.values());
          pinchD0 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchK0 = view.k;
        }
        viewport.classList.add("dragging");
      });
      viewport.addEventListener("pointermove", function (e) {
        if (!pointers.has(e.pointerId)) return;
        var prev = pointers.get(e.pointerId);
        var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          dragMoved += Math.abs(dx) + Math.abs(dy);
          if (dragMoved > 6) {
            tapNode = null;
            if (!captured) {
              captured = true;
              try { viewport.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            }
            view.tx += dx; view.ty += dy;
            applyView();
          }
        } else if (pointers.size === 2) {
          var pts = Array.from(pointers.values());
          var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          var rect = viewport.getBoundingClientRect();
          var mx = (pts[0].x + pts[1].x) / 2 - rect.left;
          var my = (pts[0].y + pts[1].y) / 2 - rect.top;
          var target = pinchK0 * (d / Math.max(pinchD0, 1));
          zoomAt(mx, my, target / view.k);
          dragMoved += 10;
        }
      });
      function endPointer(e) {
        var wasTap = pointers.size === 1 && dragMoved <= 6 && tapNode;
        pointers.delete(e.pointerId);
        if (pointers.size === 0) {
          viewport.classList.remove("dragging");
          captured = false;
          if (dragMoved > 6) {
            suppressClick = true;
            setTimeout(function () { suppressClick = false; }, 80);
          } else if (wasTap) {
            /* 点按节点：直接切换展开/折叠，并吞掉随后可能派发到节点的 click，避免二次触发 */
            var n = tapNode;
            suppressClick = true;
            setTimeout(function () { suppressClick = false; }, 150);
            if (n.depth > 0 && n.children.length) {
              n.collapsed = !n.collapsed;
              layout(true);
            }
          }
          tapNode = null;
        }
      }
      viewport.addEventListener("pointerup", endPointer);
      viewport.addEventListener("pointercancel", endPointer);
      window.addEventListener("pointerup", endPointer);
      window.addEventListener("pointercancel", endPointer);
      viewport.addEventListener("wheel", function (e) {
        e.preventDefault();
        if (animId || animTimer) completeAnim();
        userTouched = true;
        var rect = viewport.getBoundingClientRect();
        zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 0.89);
      }, { passive: false });

      /* ================= 工具栏 ================= */
      function setCollapsedWhere(fn) {
        all.forEach(function (n) { if (n.depth >= 1 && n.children.length) n.collapsed = fn(n); });
        /* 展开/收起后自动重新适应屏幕：等动画落位时触发（动画完成回调
           或兜底定时器都会处理），讲课时不用再多点一次 */
        fitPending = true;
        layout(true);
      }
      document.getElementById("btnAll").addEventListener("click", function () { setCollapsedWhere(function () { return false; }); });
      document.getElementById("btnL2").addEventListener("click", function () { setCollapsedWhere(function (n) { return n.depth >= 2; }); });
      document.getElementById("btnL1").addEventListener("click", function () { setCollapsedWhere(function (n) { return n.depth >= 1; }); });
      document.getElementById("btnFit").addEventListener("click", fitView);
      document.getElementById("btnIn").addEventListener("click", function () { zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25); });
      document.getElementById("btnOut").addEventListener("click", function () { zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.8); });
      document.getElementById("btnFull").addEventListener("click", function () {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen();
        } catch (err) { /* 沙盒环境可能不允许全屏，忽略 */ }
      });
      document.addEventListener("fullscreenchange", function () { setTimeout(fitView, 60); });

      var resizeTimer = null;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitView, 180);
      });

      /* ================= 启动 ================= */
      layout(false);
      fitView();

      /* 字体是异步加载的（网络慢或被拦截时尤其明显）：启动测量若赶在
         网页字体生效之前，量到的节点宽高与实际渲染不一致，连线端点
         就会错位、看起来像没连上。字体就绪 / 页面 load 后各重测一次，
         用正确的宽高重排；用户已经手动操作过就不再抢着适应屏幕。 */
      function remeasure() {
        measureAll();
        layout(false);
        if (!userTouched) fitView();
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(remeasure);
      }
      window.addEventListener("load", remeasure);
    })();
    </script>
  </body>
</html>
